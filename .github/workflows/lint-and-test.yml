name: Lint and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 🏃‍♂️‍➡️ Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: 👩‍🔧 Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: 👨‍🔧 Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 🏋️ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build project
        run: pnpm -r build

      - name: 🧭 Run lint check
        run: pnpm check

      - name: 🧨 Run test
        run: |
          pnpm test > test-output.log 2>&1 || TEST_FAILED=1
          echo "Total: $(wc -l < test-output.log) lines"
          echo "---"
          grep -E 'FAIL|ERROR' test-output.log || echo "(no fails found)"
          echo "---"
          tail -n 50 test-output.log
          [ -z "$TEST_FAILED" ] || exit 1

      - name: 📁 Upload test logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          path: test-output.log
